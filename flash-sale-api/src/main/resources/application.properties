# Shared defaults loaded for every environment.
# An active profile loads application-<profile>.properties and overrides matching settings.
# Select a profile with SPRING_PROFILES_ACTIVE (for example, dev, test, or prod).
server.port=8081
# Apply Flyway migrations as a controlled deployment step, not on application startup.
spring.flyway.enabled=false
# Flyway owns the schema; Hibernate must not create or modify it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Reservations require explicitly provisioned Redis; it is not checked by the health endpoint.
inventory.cache.enabled=${INVENTORY_CACHE_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=200ms
spring.data.redis.timeout=200ms
spring.data.redis.repositories.enabled=false
management.health.redis.enabled=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
# Relay scans the API's configured Redis Cluster and uses spring.kafka producer settings.
# Enable only when Redis Cluster and Kafka are provisioned. Delivery is at least once.
# Relay requires acks=all/-1, idempotence=true, String serializers, and no transactional.id.
# It snapshots producer properties at startup; later factory changes do not affect the relay.
relay.enabled=${RELAY_ENABLED:false}
relay.topic=${RELAY_TOPIC:order-requests-v1}
relay.poll-ms=${RELAY_POLL_MS:1000}
relay.timeout-ms=${RELAY_TIMEOUT_MS:5000}
