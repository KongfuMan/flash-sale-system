# Local Citus coordinator; override credentials for other environments.
spring:
  datasource:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5442/flash_sale_system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  data:
    redis:
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:redis-shard-1.test:7001,redis-shard-2.test:7002,redis-shard-3.test:7003}

# Apply migrations explicitly after verifying the target database.
  flyway:
    enabled: false
# The existing Citus schema has not yet received all application migrations.
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.format_sql: true

# Expose metrics for the local Prometheus server. Secure management endpoints outside development.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

server:
# Enable Tomcat connector metrics, including HTTP worker threads.
  tomcat:
    mbeanregistry:
      enabled: true

# Log SQL generated by Hibernate.
logging:
  level:
    org.hibernate.SQL: DEBUG
    # Log bound parameter values.
    org.hibernate.orm.jdbc.bind: TRACE
