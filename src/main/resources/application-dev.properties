# Docker Citus coordinator, accessed from the host. Override these for another cluster.
spring.datasource.url=${CITUS_JDBC_URL:jdbc:postgresql://localhost:5442/postgres}
spring.datasource.username=${CITUS_USERNAME:postgres}
spring.datasource.password=${CITUS_PASSWORD:postgres}

# Do not apply demo migrations to an existing local cluster automatically.
spring.flyway.enabled=false

# Log SQL generated by Hibernate.
#logging.level.org.hibernate.SQL=DEBUG

# Log bound parameter values.
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Format SQL for readability.
#spring.jpa.properties.hibernate.format_sql=true