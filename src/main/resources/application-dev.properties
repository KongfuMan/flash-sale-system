# Local Citus coordinator; override credentials for other environments.
spring.datasource.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5442/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Apply migrations explicitly after verifying the target database.
spring.flyway.enabled=false
# The existing Citus schema has not yet received all application migrations.
spring.jpa.hibernate.ddl-auto=none

# Expose metrics for the local Prometheus server. Secure management endpoints outside development.
management.endpoints.web.exposure.include=health,prometheus
# Enable Tomcat connector metrics, including HTTP worker threads.
server.tomcat.mbeanregistry.enabled=true
# Export histogram buckets for approximate HTTP latency percentiles.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Log SQL generated by Hibernate.
#logging.level.org.hibernate.SQL=DEBUG

# Log bound parameter values.
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Format SQL for readability.
#spring.jpa.properties.hibernate.format_sql=true
